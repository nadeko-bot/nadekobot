name: Deploy NadekoBot Docs

on:
  push:
    branches: ["v6"]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      send_all:
        description: 'Send all docs pages to IndexNow, not only the changed pages'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.repository == 'nadeko-bot/nadekobot' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The sitemap date of each page is the date of its last commit (docs/hooks/lastmod.py).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'docs/mkdocs-requirements.txt'

      - name: Install project dependencies
        run: pip install -r docs/mkdocs-requirements.txt

      - name: Save the live sitemap
        run: curl -fsS "https://docs.nadeko.bot/sitemap.xml?v=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/old-sitemap.xml" || echo "No live sitemap. IndexNow gets all pages."

      - name: Build the site with MkDocs
        working-directory: ./docs
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        working-directory: ./docs
        run: mkdocs gh-deploy --force

      - name: Send the changed pages to IndexNow
        working-directory: ./docs
        run: python indexnow.py --old "$RUNNER_TEMP/old-sitemap.xml" --new site/sitemap.xml ${{ inputs.send_all && '--all' || '' }}
