site_name: 'NadekoBot'
site_description: 'Guides to host your own NadekoBot, the open source Discord bot, and to use its AI agent, waifu system and medusa plugins.'
site_url: 'https://docs.nadeko.bot/'
repo_url: 'https://github.com/nadeko-bot/nadekobot'
site_author: 'Breaker'
docs_dir: 'md'

theme:
    name: material
    custom_dir: overrides
    language: en
    palette:
          - media: "(prefers-color-scheme: light)"
            scheme: default
            primary: custom
            accent: custom
            toggle:
                icon: material/weather-sunny
                name: Switch to dark mode
          - media: "(prefers-color-scheme: dark)"
            scheme: slate
            primary: custom
            accent: custom
            toggle:
                icon: material/weather-night
                name: Switch to light mode
    features:
        - navigation.instant
        - navigation.expand
        - navigation.top
        - content.code.copy
    font: false
    logo: assets/seal.svg
    favicon: assets/seal.svg
    icon:
        repo: material/github

extra:
    homepage: https://nadeko.bot

extra_css:
    - assets/stylesheets/fonts.css
    - assets/stylesheets/nadeko.css

plugins:
    - search
    - exclude:
        glob:
          - 'snippets/*'
    - redirects:
        redirect_maps:
          'medusa/snek-lifecycle.md': 'medusa/creating-a-medusa.md#lifecycle'
          'guides/vps-linux-guide.md': 'guides/linux-server.md'
          # The placeholder list is on the site's embed builder (nadeko.bot redirects /placeholders too).
          'placeholders.md': 'https://nadeko.bot/tools/embed-builder#placeholders'
          'en/latest/placeholders.md': 'https://nadeko.bot/tools/embed-builder#placeholders'
          # Pages for members are feature pages on nadeko.bot; the docs keep what a bot owner needs.
          'waifu-guide.md': 'https://nadeko.bot/features/waifus'
          'ai-agent/overview.md': 'https://nadeko.bot/features/ai-agent'

# Each page's sitemap date is the date of its last Git commit (needs the full history in CI).
hooks:
    - hooks/lastmod.py

markdown_extensions:
    - attr_list
    - codehilite:
        guess_lang: false
    - toc:
        permalink: true
    - pymdownx.betterem:
        smart_enable: all
    - admonition
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.blocks.tab:
        alternate_style: true
    - pymdownx.snippets:
        check_paths: true
    - pymdownx.details
    - pymdownx.keys
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
    - Home: index.md
    - Guides:
        - Create a Discord bot: creds-guide.md
        - Get a Linux server: guides/linux-server.md
        - Desktop guide (Upeko): guides/desktop-guide.md
        - CLI guide: guides/cli-guide.md
        - Docker guide: guides/docker-guide.md
        - Source guide: guides/source-guide.md
        - Bot settings (.config): guides/config.md
        - Database: guides/database.md
    - Commands: https://nadeko.bot/commands/
    - Features:
        - Waifu system: https://nadeko.bot/features/waifus
        - AI agent:
            - Overview: https://nadeko.bot/features/ai-agent
            - Owner setup: ai-agent/owner-setup.md
            - Usage and skills: ai-agent/usage.md
        - Medusa plugins:
            - Getting started: medusa/getting-started.md
            - Create a medusa: medusa/creating-a-medusa.md
    - Donate: donate.md
