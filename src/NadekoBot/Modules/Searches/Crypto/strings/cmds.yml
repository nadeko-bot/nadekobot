coins:
  desc: |-
    Shows a list of 10 crypto currencies ordered by market cap.
    Shows their price, change in the last 24h, market cap and circulating and total supply.
    Paginated with 10 per page.
  ex:
    - ''
    - '2'
  params:
    - page:
        desc: Page number to show. Starts at 1.
crypto:
  desc: |-
    Shows the price, market cap, volume and supply of a cryptocurrency from coinmarketcap.com.
    The bot also shows a daily candle chart of the last 3 months.
    You can use the name or the symbol of the cryptocurrency.
  ex:
    - btc
    - bitcoin
  params:
    - name:
        desc: "The symbol or abbreviated name of the cryptocurrency to retrieve statistics for."
stock:
  desc: |-
    Shows the price, change, volume, market cap, day range and 52 week range of a stock or an ETF.
    The bot also shows a daily candle chart of the last 3 months.
    You can use a ticker symbol or a company name.
  ex:
    - tsla
    - advanced micro devices
    - amd
  params:
    - query:
        desc: "The ticker symbol or company name used to retrieve the stock's information."
