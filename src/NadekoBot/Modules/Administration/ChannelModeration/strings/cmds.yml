agerestricttoggle:
  desc: Toggles whether the current channel is age-restricted.
  ex:
    - ''
  params:
    - {}
imageonlychannel:
  desc: |-
    Toggles whether the current channel only allows images. The bot deletes other messages.
    Give a mode to turn the channel on in that mode, or to change the mode of a channel which is already on.
    Modes:
    - `lock` (default) also stops a member from typing in the channel after 3 such messages
    - `delete` only deletes the messages
  ex:
    - ''
    - 'delete'
  params:
    - {}
    - mode:
        desc: "What the bot does to a member who posts a message without an image."
linkonlychannel:
  desc: |-
    Toggles whether the current channel only allows links. The bot deletes other messages.
    Give a mode to turn the channel on in that mode, or to change the mode of a channel which is already on.
    Modes:
    - `lock` (default) also stops a member from typing in the channel after 3 such messages
    - `delete` only deletes the messages
  ex:
    - ''
    - 'delete'
  params:
    - {}
    - mode:
        desc: "What the bot does to a member who posts a message without a link."
slowmode:
  desc: |-
    Toggles slowmode on the current channel with the specified amount of time. Maximum is 6 hours. Provide no parameters to disable.
  ex:
    - ''
    - 27s
    - 3h15m5s
  params:
    - timespan:
        desc: The duration for which the slowmode should be enabled.
delmsgoncmd:
  desc: |-
    Toggles the automatic deletion of the user's successful command message to prevent chat flood. You can use it either as a server toggle, channel whitelist, or channel blacklist, as channel option has 3 settings: Enable (always do it on this channel), Disable (never do it on this channel), and Inherit (respect server setting). Use `list` parameter to see the current states.
  ex:
    - ''
    - channel enable
    - ch inherit
    - list
  params:
    - _:
        desc: The word 'server'
    - _:
        desc: The word 'channel'
      s:
        desc: The state to set. One of 'enable', 'disable', or 'inherit'.
      ch:
        desc: Channel in which to set
    - _:
        desc: The word 'channel'
      s:
        desc: The state to set. One of 'enable', 'disable', or 'inherit'.
      chId:
        desc: Optional channel id. If omitted, defaults to the current channel.
    - _:
        desc: The word 'list'
