threadcreate:
  desc: |-
    Create a public thread with the specified title. You may optionally reply to a message to have it as a starting point.
  ex:
    - Q&A
  params:
    - name:
        desc: |-
          The title of the new thread, which will be displayed in the forum's list of threads.
threaddelete:
  desc: Delete a thread with the specified name in this channel. Case insensitive.
  ex:
    - Q&A
  params:
    - name:
        desc: |-
          The name of the thread to delete.
autothread:
  desc: |-
    Makes the bot create a thread for each new message in this channel.
    Use the command without options to turn the feature on or off.
    Modes:
    - `all` (default) creates a thread for any message
    - `media` creates a thread only for messages with an attachment or a link
    Archive durations: `1h`, `24h` (default), `3d`, `7d`. `3d` and `7d` need a boosted server.
    Use `--backfill` to also create threads for recent messages.
  ex:
    - ''
    - '-m media'
    - '--mode all --archive 3d'
    - '-m media -b 5'
  params:
    - args:
        desc: |-
          Options. `-m`, `--mode` sets the messages that start a thread. Available values: `all`, `media`.
          `-a`, `--archive` sets the time after which the bot archives an inactive thread. Available values: `1h`, `24h`, `3d`, `7d`.
          `-b`, `--backfill` creates threads for that many recent messages. Available values: `1` to `10`.
autothreadlist:
  desc: Shows the channels in which the bot creates threads automatically.
  ex:
    - ''
  params:
    - { }
