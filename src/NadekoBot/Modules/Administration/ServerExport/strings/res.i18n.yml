ar:
  server_export_owner_only: لا يمكن إلا لمالك الخادم تصدير بيانات هذا الخادم.
  server_export_self_only: شغّل هذا الأمر بنفسك. لا يمكن لاسم مستعار أو أمر مجدول أو وكيل الذكاء الاصطناعي تشغيله.
  server_export_cooldown: 'يمكنك تصدير بيانات هذا الخادم مرة أخرى {0}.'
  server_export_busy: البوت مشغول بعمليات تصدير أخرى. حاول مرة أخرى بعد 10 دقائق.
  server_export_dm_closed: لا يستطيع البوت إرسال رسالة خاصة إليك. اسمح بالرسائل الخاصة من أعضاء الخادم وحاول مرة أخرى.
  server_export_preparing: 'البوت يجهّز تصدير بيانات **{0}**.'
  server_export_dm: |-
    هذا هو تصدير بيانات **{0}**. استورد هذا الملف على بوت NadeKloud الخاص بك.
    بعد الاستيراد، أزل هذا البوت من الخادم حتى لا يعمل البوتان في الوقت نفسه.
  server_export_xp_omitted: 'لا يحتوي الملف على XP، لأن ملف XP كبير جداً على Discord. للحصول على تصدير كامل، تواصل مع `@br.eaker` أو المشرفين في خادم NadekoLog: {0}'
  server_export_too_large: 'التصدير كبير جداً على Discord، حتى بدون XP. تواصل مع `@br.eaker` أو المشرفين في خادم NadekoLog: {0}'
  server_export_sent: أرسل البوت تصدير البيانات إلى رسائلك الخاصة.
  server_export_failed: فشل التصدير. حاول مرة أخرى بعد 10 دقائق.
  server_export_saved: 'حفظ البوت التصدير في {0}'
  server_export_no_data: ليس لدى البوت أي بيانات لهذا الخادم.

de-DE:
  server_export_owner_only: Nur der Serverbesitzer kann die Daten dieses Servers exportieren.
  server_export_self_only: Führe diesen Befehl selbst aus. Ein Alias, ein geplanter Befehl oder der KI-Agent kann ihn nicht ausführen.
  server_export_cooldown: 'Du kannst die Daten dieses Servers {0} erneut exportieren.'
  server_export_busy: Der Bot ist mit anderen Exporten beschäftigt. Versuche es in 10 Minuten erneut.
  server_export_dm_closed: Der Bot kann dir keine DM senden. Erlaube DMs von Servermitgliedern und versuche es erneut.
  server_export_preparing: 'Der Bot bereitet den Datenexport von **{0}** vor.'
  server_export_dm: |-
    Das ist der Datenexport von **{0}**. Importiere diese Datei in deinen NadeKloud Bot.
    Entferne danach diesen Bot vom Server, damit nicht beide Bots gleichzeitig arbeiten.
  server_export_xp_omitted: 'Die Datei enthält kein XP, weil die XP-Datei zu groß für Discord ist. Für einen vollständigen Export wende dich an `@br.eaker` oder die Admins auf dem NadekoLog Server: {0}'
  server_export_too_large: 'Der Export ist zu groß für Discord, auch ohne XP. Wende dich an `@br.eaker` oder die Admins auf dem NadekoLog Server: {0}'
  server_export_sent: Der Bot hat den Datenexport an deine DMs gesendet.
  server_export_failed: Der Export ist fehlgeschlagen. Versuche es in 10 Minuten erneut.
  server_export_saved: 'Der Bot hat den Export in {0} gespeichert.'
  server_export_no_data: Der Bot hat keine Daten für diesen Server.

es-ES:
  server_export_owner_only: Solo el dueño del servidor puede exportar los datos de este servidor.
  server_export_self_only: Ejecuta este comando tú mismo. Un alias, un comando programado o el agente de IA no pueden ejecutarlo.
  server_export_cooldown: 'Podrás exportar los datos de este servidor de nuevo {0}.'
  server_export_busy: El bot está ocupado con otras exportaciones. Inténtalo de nuevo en 10 minutos.
  server_export_dm_closed: El bot no puede enviarte un MD. Permite los MD de miembros del servidor e inténtalo de nuevo.
  server_export_preparing: 'El bot está preparando la exportación de los datos de **{0}**.'
  server_export_dm: |-
    Esta es la exportación de los datos de **{0}**. Importa este archivo en tu bot de NadeKloud.
    Después de la importación, quita este bot del servidor, para que los dos bots no actúen a la vez.
  server_export_xp_omitted: 'El archivo no contiene xp, porque el archivo con xp es demasiado grande para Discord. Para una exportación completa, contacta con `@br.eaker` o con los admins del servidor NadekoLog: {0}'
  server_export_too_large: 'La exportación es demasiado grande para Discord, incluso sin xp. Contacta con `@br.eaker` o con los admins del servidor NadekoLog: {0}'
  server_export_sent: El bot te ha enviado la exportación de los datos por MD.
  server_export_failed: La exportación ha fallado. Inténtalo de nuevo en 10 minutos.
  server_export_saved: 'El bot ha guardado la exportación en {0}'
  server_export_no_data: El bot no tiene datos de este servidor.

fr-FR:
  server_export_owner_only: Seul le propriétaire du serveur peut exporter les données de ce serveur.
  server_export_self_only: Lance cette commande toi-même. Un alias, une commande programmée ou l'agent IA ne peut pas la lancer.
  server_export_cooldown: 'Tu pourras exporter à nouveau les données de ce serveur {0}.'
  server_export_busy: Le bot est occupé avec d'autres exports. Réessaie dans 10 minutes.
  server_export_dm_closed: Le bot ne peut pas t'envoyer de MP. Autorise les MP des membres du serveur et réessaie.
  server_export_preparing: 'Le bot prépare l''export des données de **{0}**.'
  server_export_dm: |-
    Voici l'export des données de **{0}**. Importe ce fichier sur ton bot NadeKloud.
    Après l'import, retire ce bot du serveur pour que les deux bots n'agissent pas en même temps.
  server_export_xp_omitted: 'Le fichier ne contient pas l''XP, car le fichier XP est trop volumineux pour Discord. Pour un export complet, contacte `@br.eaker` ou les admins du serveur NadekoLog : {0}'
  server_export_too_large: 'L''export est trop volumineux pour Discord, même sans l''XP. Contacte `@br.eaker` ou les admins du serveur NadekoLog : {0}'
  server_export_sent: Le bot a envoyé l'export des données dans tes MP.
  server_export_failed: L'export a échoué. Réessaie dans 10 minutes.
  server_export_saved: 'Le bot a enregistré l''export dans {0}'
  server_export_no_data: Le bot n'a aucune donnée pour ce serveur.

id-ID:
  server_export_owner_only: Hanya pemilik server yang bisa mengekspor data server ini.
  server_export_self_only: Jalankan perintah ini sendiri. Alias, perintah terjadwal, atau agen AI tidak bisa menjalankannya.
  server_export_cooldown: 'Kamu bisa mengekspor data server ini lagi {0}.'
  server_export_busy: Bot sedang sibuk dengan ekspor lain. Coba lagi dalam 10 menit.
  server_export_dm_closed: Bot tidak bisa mengirim DM ke kamu. Izinkan DM dari anggota server lalu coba lagi.
  server_export_preparing: 'Bot sedang menyiapkan ekspor data **{0}**.'
  server_export_dm: |-
    Ini adalah ekspor data **{0}**. Impor file ini di bot NadeKloud kamu.
    Setelah impor, keluarkan bot ini dari server, agar kedua bot tidak sama-sama bertindak.
  server_export_xp_omitted: 'File ini tidak berisi xp, karena file dengan xp terlalu besar untuk Discord. Untuk ekspor penuh, hubungi `@br.eaker` atau admin di server NadekoLog: {0}'
  server_export_too_large: 'Ekspor terlalu besar untuk Discord, bahkan tanpa xp. Hubungi `@br.eaker` atau admin di server NadekoLog: {0}'
  server_export_sent: Bot sudah mengirim ekspor data ke DM kamu.
  server_export_failed: Ekspor gagal. Coba lagi dalam 10 menit.
  server_export_saved: 'Bot menyimpan ekspor ke {0}'
  server_export_no_data: Bot tidak punya data untuk server ini.

ja-JP:
  server_export_owner_only: このサーバーのデータをエクスポートできるのはサーバー所有者だけです。
  server_export_self_only: このコマンドは自分で実行してください。エイリアス、スケジュールされたコマンド、AIエージェントは実行できません。
  server_export_cooldown: 'このサーバーのデータは{0}にまたエクスポートできます。'
  server_export_busy: ボットは他のエクスポートで忙しいです。10分後にもう一度試してください。
  server_export_dm_closed: ボットがDMを送れません。サーバーメンバーからのDMを許可して、もう一度試してください。
  server_export_preparing: 'ボットは**{0}**のデータエクスポートを準備しています。'
  server_export_dm: |-
    これは**{0}**のデータエクスポートです。このファイルをNadeKloudのボットにインポートしてください。
    インポートしたら、このボットをサーバーから外してください。2つのボットが同時に動かないようにするためです。
  server_export_xp_omitted: 'ファイルにxpが含まれていません。xpを含むファイルがDiscordには大きすぎるためです。完全なエクスポートが必要なら、`@br.eaker`かNadekoLogサーバーの管理者に連絡してください: {0}'
  server_export_too_large: 'エクスポートはxpなしでもDiscordには大きすぎます。`@br.eaker`かNadekoLogサーバーの管理者に連絡してください: {0}'
  server_export_sent: ボットがデータエクスポートをDMに送りました。
  server_export_failed: エクスポートに失敗しました。10分後にもう一度試してください。
  server_export_saved: 'ボットはエクスポートを{0}に保存しました。'
  server_export_no_data: ボットはこのサーバーのデータを持っていません。

ko-KR:
  server_export_owner_only: 이 서버의 데이터를 내보낼 수 있는 사람은 서버 소유자뿐이에요.
  server_export_self_only: 이 명령은 직접 실행해 주세요. 별칭, 예약된 명령, AI 에이전트는 실행할 수 없어요.
  server_export_cooldown: '이 서버의 데이터는 {0}에 다시 내보낼 수 있어요.'
  server_export_busy: 봇이 다른 내보내기 작업으로 바빠요. 10분 후에 다시 시도해 주세요.
  server_export_dm_closed: 봇이 DM을 보낼 수 없어요. 서버 멤버의 DM을 허용하고 다시 시도해 주세요.
  server_export_preparing: '봇이 **{0}**의 데이터 내보내기를 준비하고 있어요.'
  server_export_dm: |-
    **{0}**의 데이터 내보내기 파일이에요. 이 파일을 NadeKloud 봇에 가져오세요.
    가져온 뒤에는 이 봇을 서버에서 제거해 주세요. 두 봇이 동시에 동작하지 않게 하기 위해서예요.
  server_export_xp_omitted: 'xp가 포함된 파일이 Discord에 보내기엔 너무 커서 파일에 xp가 없어요. 전체 내보내기가 필요하면 `@br.eaker`나 NadekoLog 서버의 관리자에게 연락해 주세요: {0}'
  server_export_too_large: 'xp 없이도 내보내기 파일이 Discord에 보내기엔 너무 커요. `@br.eaker`나 NadekoLog 서버의 관리자에게 연락해 주세요: {0}'
  server_export_sent: 봇이 데이터 내보내기를 DM으로 보냈어요.
  server_export_failed: 내보내기에 실패했어요. 10분 후에 다시 시도해 주세요.
  server_export_saved: '봇이 내보내기를 {0}에 저장했어요.'
  server_export_no_data: 봇이 이 서버의 데이터를 가지고 있지 않아요.

