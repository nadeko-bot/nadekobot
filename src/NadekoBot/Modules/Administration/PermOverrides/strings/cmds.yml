discordpermoverride:
  desc: |-
    Replaces the user permissions that a command requires with the specified permissions.
    You can use only server-level permissions.
    The bot then ignores the default user permission requirements of the command.
    Overrides work only for commands, not for expressions.
    Provide no permissions to reset the command to its default requirements.
  ex:
    - '{0}prune ManageMessages BanMembers'
    - '{0}prune'
  params:
    - cmd:
        desc: |-
          The command, with its prefix, that the override applies to.
      perms:
        desc: |-
          The set of permissions that should be used instead of the command's default permissions.
discordpermoverridelist:
  desc: Lists all discord permission overrides on this server.
  ex:
    - ''
  params:
    - page:
        desc: The number of the page to display in the list of permission overrides.
discordpermoverridereset:
  desc: |-
    Resets ALL currently set discord permission overrides on this server. This will make all commands have default discord permission requirements.
  ex:
    - ''
  params:
    - {}
