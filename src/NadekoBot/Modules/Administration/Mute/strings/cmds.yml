chatmute:
  desc: |-
    Prevents a mentioned user from chatting in text channels. You can also specify time string for how long the user should be muted (min 1 minute, max 49 days). You can optionally specify a reason.
  ex:
    - '@Someone'
    - '@Someone stop writing'
    - 15m @Someone
    - 1h30m @Someone
    - 1h @Someone chill
  params:
    - user:
        desc: The user to mute, as specified by their ID or mention.
      reason:
        desc: |-
          The optional reason provided is used to explain why the user was muted.
    - timespan:
        desc: The duration of the mute period.
      user:
        desc: The user to mute, as specified by their ID or mention.
      reason:
        desc: |-
          The optional reason provided is used to explain why the user was muted.
chatunmute:
  desc: |-
    Removes a mute role previously set on a mentioned user with `{0}chatmute` which prevented him from chatting in text channels.
  ex:
    - '@Someone'
  params:
    - user:
        desc: The user who was previously muted and is now being unmuted.
      reason:
        desc: The reason for the mute being lifted.
mute:
  desc: |-
    Mutes a mentioned user both from speaking and chatting. You can also specify time string for how long the user should be muted (min 1 minute, max 49 days). You can optionally specify a reason.
  ex:
    - '@Someone'
    - '@Someone too noisy'
    - 1h30m @Someone
    - 1h30m @Someone too noisy
  params:
    - target:
        desc: The user to whom the mute action is being applied.
      reason:
        desc: The optional reason provided helps to explain why the user was muted.
    - timespan:
        desc: The duration of the mute period.
      user:
        desc: The user to whom the mute action is being applied.
      reason:
        desc: The optional reason provided helps to explain why the user was muted.
muterole:
  desc: |-
    Sets a name of the role which will be assigned to people who should be muted. Provide no arguments to see currently set mute role. Default is nadeko-mute.
  ex:
    - ''
    - Silenced
  params:
    - role:
        desc: The role that determines whether users are muted or not.
unmute:
  desc: Unmutes a mentioned user previously muted with `{0}mute` command.
  ex:
    - '@Someone'
  params:
    - user:
        desc: The user who was previously muted and is now being un-muted.
      reason:
        desc: The reason for the mute being lifted.
voicemute:
  desc: |-
    Prevents a mentioned user from speaking in voice channels. User has to be in a voice channel in order for the command to have an effect. You can also specify time string for how long the user should be muted (min 1 minute, max 49 days). You can optionally specify a reason.
  ex:
    - '@Someone'
    - '@Someone stop talking'
    - 15m @Someone
    - 1h30m @Someone
    - 1h @Someone silence
  params:
    - user:
        desc: |-
          The user being targeted by this command, whose voice capabilities are intended to be restricted.
      reason:
        desc: |-
          The optional reason provided is used to explain why the user was muted.
    - timespan:
        desc: The duration of the silence imposed on the mentioned user.
      user:
        desc: |-
          The user being targeted by this command, whose voice capabilities are intended to be restricted.
      reason:
        desc: |-
          The optional reason provided is used to explain why the user was muted.
voiceunmute:
  desc: Gives a previously voice-muted user a permission to speak.
  ex:
    - '@Someguy'
  params:
    - user:
        desc: |-
          The user who was previously muted is now able to participate in the conversation again.
      reason:
        desc: The reason for the user's previous mute.
