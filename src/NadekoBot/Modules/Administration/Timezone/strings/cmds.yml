timezone:
  desc: |-
    Sets this guild's timezone. This affects bot's time output in this server (logs, etc.). **Setting timezone requires Administrator server permission.**
    You can use a timezone id, such as `Europe/Berlin`, or a city, such as `Berlin`. Letter case does not matter.
  ex:
    - ''
    - GMT Standard Time
  params:
    - {}
    - id:
        desc: The identifier for a specific timezone region.
timezones:
  desc: Lists all timezones available on the system to be used with `{0}timezone`.
  ex:
    - ''
  params:
    - page:
        desc: The page number to display from the list of available timezones.
