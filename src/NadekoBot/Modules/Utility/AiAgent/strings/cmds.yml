agent:
  desc: |-
    Runs an AI agent that can use tools to accomplish complex tasks on your behalf.
    The agent can read messages, send messages to channels, split long texts, and more.
    All actions respect your permissions. You can also trigger this by @mentioning the bot.
  ex:
    - 'split the last long message in this channel and send the parts to #general'
    - 'get the message with ID 123456789 from #rules and post it in #announcements'
  params:
    - query:
        desc: "What you want the AI agent to do"
agentcancel:
  desc: |-
    Cancels your currently running AI agent session.
  ex:
    - ''
  params:
    - { }
agentskilladd:
  desc: |-
    Adds a named skill to the AI agent for this server.
    Skills are custom instructions that get included in every agent interaction.
    Maximum 10 skills per server, 1000 characters per instruction.
  ex:
    - 'moderator Always enforce the server rules strictly and warn users before taking action'
    - 'greeter Welcome new users warmly and point them to the #rules channel'
  params:
    - name:
        desc: "Short name for the skill"
      instruction:
        desc: "The instruction text for the agent to follow"
agentskillremove:
  desc: |-
    Permanently removes a skill from the AI agent for this server.
  ex:
    - 'moderator'
  params:
    - name:
        desc: "Name of the skill to remove"
agentskilltoggle:
  desc: |-
    Enables or disables a skill without removing it.
    Disabled skills are not included in agent interactions.
  ex:
    - 'moderator'
  params:
    - name:
        desc: "Name of the skill to toggle"
agentskilllist:
  desc: |-
    Lists all configured AI agent skills for this server.
    Shows each skill's name, status, and a preview of the instruction.
  ex:
    - ''
  params:
    - { }
agentchannelskilladd:
  desc: |-
    Adds a named skill to the AI agent for the current channel only.
    Channel skills only apply when the agent is invoked in this channel.
  ex:
    - 'support Always check the FAQ before answering questions'
  params:
    - name:
        desc: "Short name for the skill"
      instruction:
        desc: "The instruction text for the agent to follow"
agentchannelskillremove:
  desc: |-
    Removes a channel-specific skill from the AI agent.
  ex:
    - 'support'
  params:
    - name:
        desc: "Name of the skill to remove"
agentchannelskilltoggle:
  desc: |-
    Toggles a channel-specific skill on or off.
  ex:
    - 'support'
  params:
    - name:
        desc: "Name of the skill to toggle"
agentchannelskilllist:
  desc: |-
    Lists all channel-specific AI agent skills for the current channel.
  ex:
    - ''
  params:
    - { }
aprompts:
  desc: |-
    Lists all AI agent prompt files with their sizes and enabled status.
  ex:
    - ''
  params:
    - { }
apromptshow:
  desc: |-
    Shows the contents of a prompt file. DMs the content if it's too long.
  ex:
    - 'SOUL'
    - 'OPERATOR'
    - 'my-persona'
  params:
    - path:
        desc: "Prompt file name (SOUL, OPERATOR, or a module name)"
apromptedit:
  desc: |-
    Overwrites a prompt file with the given content.
    You can provide the content as text or attach a .md file.
  ex:
    - 'SOUL You are Nadeko, a cheerful and helpful Discord bot.'
    - 'my-persona Respond with extra enthusiasm.'
  params:
    - path:
        desc: "Prompt file name (SOUL, OPERATOR, or a module name)"
      content:
        desc: "New content for the file (or attach a .md file)"
apromptreload:
  desc: |-
    Reloads all prompt files from disk and broadcasts to all shards.
  ex:
    - ''
  params:
    - { }
apromptmodule:
  desc: |-
    Toggles a prompt module on or off. When all modules are enabled (default),
    toggling one off switches to an explicit list.
  ex:
    - 'my-persona'
    - 'concise'
  params:
    - name:
        desc: "Name of the module to toggle"
apromptpath:
  desc: |-
    Shows the absolute path to the prompts directory.
  ex:
    - ''
  params:
    - { }
