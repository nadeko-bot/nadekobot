giveawaycancel:
  desc: |-
    Cancels a giveaway. Specify the ID of the giveaway to cancel. The bot does not pick winners.
  ex:
    - ab3
  params:
    - id:
        desc: The identifier for the giveaway being cancelled.
giveawayend:
  desc: |-
    Ends a giveaway now and picks the winners. Specify the ID of the giveaway to end.
  ex:
    - ab3
  params:
    - id:
        desc: The identifier for the giveaway that is being terminated.
giveawaylist:
  desc: Lists all active giveaways.
  ex:
    - ''
  params:
    - {}
giveawayreroll:
  desc: |-
    Rerolls a giveaway. Specify the ID of the giveaway to reroll. The bot picks one new winner who did not win before.
    This is only active within 24h after the giveaway has ended or until the bot restarts.
  ex:
    - cd3
  params:
    - id:
        desc: The identifier for the specific giveaway being rerolled.
giveawaystart:
  desc: |-
    Starts a giveaway. Specify the duration (up to 30 days) followed by the prize.
    To pick more than one winner, put the number of winners and `w` before the prize, for example `3w`. The maximum is 20 winners.
  ex:
    - 12h 3w We are giving away three copies of our latest album!
  params:
    - duration:
        desc: The length of time for which the giveaway will be active.
      message:
        desc: The description of the prize being awarded in this giveaway.
