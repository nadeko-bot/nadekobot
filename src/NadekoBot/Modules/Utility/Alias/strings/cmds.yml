alias:
  desc: |-
    Creates a custom alias for a command. Give no mapping to remove the alias.
    An alias cannot give arguments to a command which spends currency. The member gives them.
  ex:
    - bf {0}betflip
  params:
    - trigger:
        desc: The alias name that will be used to invoke the command.
      mapping:
        desc: The original command that the alias maps to.
aliasesclear:
  desc: Deletes all aliases on this server.
  ex:
    - ''
  params:
    - {}
aliaslist:
  desc: Shows the list of currently set aliases. Paginated.
  ex:
    - ''
    - 3
  params:
    - page:
        desc: The page number to display.
