convert:
  desc: |-
    Converts a value from one unit or currency to another.
    Give the value, the unit and the target unit. You can write `to` between the units.
    If you give no target unit, the bot shows the value in common units.
    The bot accepts SI prefixes (`km`, `MB`, `µs`) and combined units (`km/h`, `m2`, `USD/gal`).
    Use `{0}convertlist` to see all units and currencies.
  ex:
    - 5 km to mi
  params:
    - input:
        desc: "The value, the unit and the target unit. For example `5 km mi`, `100km/h mph` or `20 C`."
convertlist:
  desc: Shows all units and currencies which the converter accepts.
  ex:
    - ''
  params:
    - page:
        desc: "The page number to show. The default is 1."
