deletecurrency:
  desc: Deletes everything from Currency and CurrencyTransactions.
  ex:
    - ''
  params:
    - {}
deletexp:
  desc: Deletes everything from UserXpStats, Clubs and sets users' TotalXP to 0.
  ex:
    - ''
  params:
    - {}
sqlexec:
  desc: |-
    Runs SQL which changes the database, and shows the number of changed rows.
    On a NadeKloud bot, the bot stops the SQL after 60 seconds.
  ex:
    - UPDATE DiscordUser SET CurrencyAmount=CurrencyAmount+1234
  params:
    - sql:
        desc: |-
          The SQL query string to execute.
sqlselect:
  desc: |-
    Runs a SQL query which only reads the database, and shows the results.
    The bot runs the command only in DMs. It stops a query after 15 seconds.
  ex:
    - SELECT * FROM DiscordUser LIMIT 5
  params:
    - sql:
        desc: "The SQL query."
sqlselectcsv:
  desc: |-
    Runs a SQL query which only reads the database, and sends the results as a CSV file.
    The bot runs the command only in DMs. It stops a query after 15 seconds.
  ex:
    - SELECT * FROM DiscordUser LIMIT 5
  params:
    - sql:
        desc: "The SQL query."
