blackjack:
  desc: |-
    Opens a blackjack table in this channel with your bet, or joins the table which waits for players.
    Other members join with the same command within 20 seconds. The round starts when this time ends, when all 5 seats are full, or when the member who opened the table presses Start.
    The players act in seat order. A player has 30 seconds for each decision, then the hand stands.
    Buttons:
    - `Hit` takes one more card
    - `Stand` takes no more cards
    - `Double` doubles the bet, takes one card and stands. It works only when the first two cards total 9, 10 or 11, and not after a split
    - `Split` makes two hands from two cards of the same rank, for example K and K, but not K and Q. It costs the bet again. A player can split once
    The dealer takes the second card after all players finish. The dealer hits soft 17.
    Against a dealer blackjack, only a player blackjack gets the bet back.
    Blackjack pays 3:2. A win pays 1:1. A tie returns the bet.
  ex:
    - '100'
  params:
    - amount:
        desc: "The amount of currency to bet."
