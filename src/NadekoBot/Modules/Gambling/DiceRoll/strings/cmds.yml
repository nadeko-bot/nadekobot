nroll:
  desc: |-
    Rolls a random number in a range.
    If you give one number, the bot rolls a number between 0 and that number.
  ex:
    - 5
    - 5-15
    - -10-10
  params:
    - range:
        desc: "One number, or the minimum and maximum separated with `-`."
roll:
  desc: |-
    Rolls 1-100. If you supply a number `X` it rolls up to 30 normal dice.
    The format `XdY` rolls `X` dice (1-50) with `Y` sides (1-100000). `dY` rolls one die.
    You can add or subtract numbers, for example `d20+3` or `2d6+1-2`.
    `XdF` rolls `X` fate dice (1-100).
  ex:
    - ''
    - 7
    - 3d5
    - d20+3
    - 5dF
  params:
    - {}
    - num:
        desc: The number of dice to roll (1-30).
    - arg:
        desc: The dice to roll in the format `XdY`, `XdY+A-B` or `XdF`.
rolluo:
  desc: |-
    Rolls `X` normal dice (up to 30) and shows them in the order the bot rolled them.
    The format `XdY` rolls `X` dice (1-50) with `Y` sides (1-100000). `dY` rolls one die.
    You can add or subtract numbers, for example `d20+3` or `2d6+1-2`.
    `XdF` rolls `X` fate dice (1-100).
  ex:
    - ''
    - 7
    - 3d5
  params:
    - num:
        desc: The number of dice to roll (1-30).
    - arg:
        desc: The dice to roll in the format `XdY`, `XdY+A-B` or `XdF`.
